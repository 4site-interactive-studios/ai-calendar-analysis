# Calendar Analytics Configuration
# Copy this to config.yaml and customize for your organization

# Your company's email domains (used to classify internal vs external attendees)
company_domains:
  - "4sitestudios.com"
  - "stratovation.digital"
  - "brennaholmes.com"

# Company name (used in reports)
company_name: "4Site Interactive Studios"

# Optional: Override auto-detected organization names from email domains
# If not listed here, org names are derived automatically from the domain
# e.g., "greenplanet.org" becomes "Greenplanet"
organization_names:
  # "greenplanet.org": "GreenPlanet Foundation"
  # "example.com": "Example Corp"

# Calendar ID to analyze (default: primary)
calendar_id: "primary"

# Google API credentials file path
credentials_file: "credentials.json"

# Token storage path
token_file: "token.json"
